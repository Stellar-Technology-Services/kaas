# KaaS — secret contract (values never committed).
#
# Profile convention:
#   default     — shared keys used by every sandbox
#   <sandbox>   — per-instance overrides (same name as `kaas create <name>`)
#
# Keyring path: secretspec/{project}/{profile}/{key}
#   e.g. secretspec/kaas/my-app/ANTHROPIC_API_KEY
#
# Setup:
#   secretspec config global init    # pick keyring (recommended)
#   kaas secrets set ANTHROPIC_API_KEY
#   kaas secrets set GITHUB_TOKEN --sandbox work
#   kaas secrets deploy work

[project]
name = "kaas"
revision = "1.0"

[providers]
local = "keyring://"

[profiles.default]
ANTHROPIC_API_KEY = { description = "Anthropic / Claude (pi, omp)", required = false, providers = ["local"] }
OPENAI_API_KEY = { description = "OpenAI (pi, omp)", required = false, providers = ["local"] }
GITHUB_TOKEN = { description = "GitHub token (gh, Copilot, pi GitHub provider)", required = false, providers = ["local"] }
OPENROUTER_API_KEY = { description = "OpenRouter API key", required = false, providers = ["local"] }
GOOGLE_API_KEY = { description = "Google Gemini API key", required = false, providers = ["local"] }
DEEPSEEK_API_KEY = { description = "DeepSeek API key", required = false, providers = ["local"] }

# Optional per-sandbox profiles inherit from default; only declare overrides when needed.
# Example:
# [profiles.my-app]
# ANTHROPIC_API_KEY = { required = true, providers = ["local"] }

[scopes.agents]
secrets = [
  "ANTHROPIC_API_KEY",
  "OPENAI_API_KEY",
  "OPENROUTER_API_KEY",
  "GOOGLE_API_KEY",
  "DEEPSEEK_API_KEY",
  "GITHUB_TOKEN",
]

[scopes.github]
secrets = ["GITHUB_TOKEN"]
