{{define "styles"}}
<style>
  :root {
    --bg: #0f1419; --panel: #1a222c; --border: #2a3542; --text: #e7ecf1;
    --muted: #8b9aab; --accent: #7ddbb2; --accent2: #b8a9e8; --warn: #e6c35c;
    --bad: #e87b7b; --ok: #7ddbb2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #1c2430 0%, var(--bg) 55%);
    color: var(--text); min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
    background: rgba(15,20,25,.85); position: sticky; top: 0; z-index: 10;
  }
  .brand { font-weight: 700; color: var(--text); }
  .brand span { color: var(--accent2); font-weight: 500; margin-left: .35rem; }
  nav a { color: var(--muted); margin-left: 1rem; font-weight: 500; }
  nav a.active, nav a:hover { color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
  h1 { font-size: 1.35rem; margin: 0 0 1rem; font-weight: 650; }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 1.25rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; }
  .card .label { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
  .card .value { font-size: 1.55rem; font-weight: 650; margin-top: .25rem; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: .65rem .8rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; background: #151c24; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; padding: .1rem .45rem; border-radius: 999px; font-size: .72rem; font-weight: 600; background: #243041; color: var(--muted); }
  .pill.ok { background: #1d3a30; color: var(--ok); }
  .pill.bad { background: #3a2222; color: var(--bad); }
  .pill.warn { background: #3a341d; color: var(--warn); }
  .muted { color: var(--muted); }
  .stack { display: grid; gap: 1rem; }
  button, .btn {
    appearance: none; border: 1px solid var(--border); background: #243041; color: var(--text);
    border-radius: 8px; padding: .4rem .75rem; font: inherit; cursor: pointer;
  }
  button:hover, .btn:hover { border-color: var(--accent2); }
  footer { margin-top: 2rem; color: var(--muted); font-size: .8rem; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
  .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
  pre.log { background: #0b1016; border: 1px solid var(--border); border-radius: 8px; padding: .75rem; margin: .75rem 0 0;
    font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; color: #c8d3de; max-height: 22rem; overflow: auto; white-space: pre-wrap; }
  .spin { display:inline-block; width:.6em; height:.6em; margin-left:.35em; border:2px solid currentColor; border-right-color:transparent; border-radius:50%; animation: spin .8s linear infinite; vertical-align:-.05em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card.job { margin-bottom: 1rem; }
  .error { background: #3a2222; color: var(--bad); border: 1px solid #5a3333; border-radius: 8px; padding: .6rem .8rem; margin-bottom: 1rem; }
  .pill.big { font-size: .85rem; padding: .2rem .6rem; }
  .grid.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .connect .cmd { justify-content: space-between; padding: .3rem 0; border-bottom: 1px dashed var(--border); }
  .connect .cmd:last-child { border-bottom: 0; }
  button.copy { padding: .15rem .5rem; font-size: .75rem; }
  button.bad { border-color: #5a3333; background: #3a2222; color: var(--bad); }
  details.popover { position: relative; }
  details.popover summary { list-style: none; display: inline-block; }
  details.popover summary::-webkit-details-marker { display: none; }
  details.popover > form.card { position: absolute; right: 0; top: calc(100% + .4rem); z-index: 20; width: 22rem; display: grid; gap: .6rem; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
  details.danger > form.card { border-color: #5a3333; }
  form.form { display: grid; gap: 1rem; }
  form label { display: grid; gap: .3rem; }
  form label.radio { grid-template-columns: auto 1fr; align-items: baseline; gap: .5rem; }
  form label.radio input { margin: 0; }
  form label.radio strong { margin-right: .4rem; }
  form input[type=text], form input:not([type]) { background: #0b1016; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: .45rem .6rem; font: inherit; }
  form fieldset { border: 1px solid var(--border); border-radius: 10px; padding: .75rem 1rem; display: grid; gap: .5rem; }
  form legend { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; padding: 0 .4rem; }
  .meter { height: 8px; background: #0b1016; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; margin-top: .6rem; }
  .meter span { display: block; height: 100%; background: var(--accent); }
  .meter span.warn { background: var(--warn); }
  form select { background: #0b1016; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: .45rem .6rem; font: inherit; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: .25rem .75rem; margin: .5rem 0 0; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; }
  ul.plain { list-style: none; padding: 0; margin: .25rem 0 0; } ul.plain li { padding: .15rem 0; }
  .inline-form { display: inline-flex; gap: .4rem; align-items: center; }
</style>
{{end}}

{{define "nav"}}
<header>
  <div class="brand">KaaS <span>local UI</span></div>
  <nav>
    <a href="/" {{if eq .Active "home"}}class="active"{{end}}>Overview</a>
    <a href="/sandboxes" {{if eq .Active "sandboxes"}}class="active"{{end}}>Sandboxes</a>
    <a href="/templates" {{if eq .Active "templates"}}class="active"{{end}}>Templates</a>
    <a href="/services" {{if eq .Active "services"}}class="active"{{end}}>Services</a>
    <a href="/events" {{if eq .Active "events"}}class="active"{{end}}>Events</a>
    <a href="/jobs" {{if eq .Active "jobs"}}class="active"{{end}}>Jobs</a>
  </nav>
</header>
{{end}}
