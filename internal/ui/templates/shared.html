{{define "styles"}}
<style>
  :root {
    --bg: #0f1419; --panel: #1a222c; --border: #2a3542; --text: #e7ecf1;
    --muted: #8b9aab; --accent: #7ddbb2; --accent2: #b8a9e8; --warn: #e6c35c;
    --bad: #e87b7b; --ok: #7ddbb2;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    background: radial-gradient(1200px 600px at 10% -10%, #1c2430 0%, var(--bg) 55%);
    color: var(--text); min-height: 100vh;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
    background: rgba(15,20,25,.85); position: sticky; top: 0; z-index: 10;
  }
  .brand { font-weight: 700; color: var(--text); }
  .brand span { color: var(--accent2); font-weight: 500; margin-left: .35rem; }
  nav a { color: var(--muted); margin-left: 1rem; font-weight: 500; }
  nav a.active, nav a:hover { color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 1.5rem; }
  h1 { font-size: 1.35rem; margin: 0 0 1rem; font-weight: 650; }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 1.25rem; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 1rem 1.1rem; }
  .card .label { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
  .card .value { font-size: 1.55rem; font-weight: 650; margin-top: .25rem; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  th, td { text-align: left; padding: .65rem .8rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; background: #151c24; }
  tr:last-child td { border-bottom: 0; }
  .pill { display: inline-block; padding: .1rem .45rem; border-radius: 999px; font-size: .72rem; font-weight: 600; background: #243041; color: var(--muted); }
  .pill.ok { background: #1d3a30; color: var(--ok); }
  .pill.bad { background: #3a2222; color: var(--bad); }
  .pill.warn { background: #3a341d; color: var(--warn); }
  .muted { color: var(--muted); }
  .stack { display: grid; gap: 1rem; }
  button, .btn {
    appearance: none; border: 1px solid var(--border); background: #243041; color: var(--text);
    border-radius: 8px; padding: .4rem .75rem; font: inherit; cursor: pointer;
  }
  button:hover, .btn:hover { border-color: var(--accent2); }
  footer { margin-top: 2rem; color: var(--muted); font-size: .8rem; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; }
</style>
{{end}}

{{define "nav"}}
<header>
  <div class="brand">KaaS <span>local UI</span></div>
  <nav>
    <a href="/" {{if eq .Active "home"}}class="active"{{end}}>Overview</a>
    <a href="/sandboxes" {{if eq .Active "sandboxes"}}class="active"{{end}}>Sandboxes</a>
    <a href="/services" {{if eq .Active "services"}}class="active"{{end}}>Services</a>
    <a href="/events" {{if eq .Active "events"}}class="active"{{end}}>Events</a>
  </nav>
</header>
{{end}}
