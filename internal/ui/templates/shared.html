{{define "styles"}}
<style>
  /* Dark-only phosphor terminal theme. Class names are the contract with the templates. */
  :root {
    color-scheme: dark;
    --bg: #000; --panel: #000; --border: #1f5a2a; --text: #33ff66;
    --muted: #1f9e45; --accent: #66ff99; --accent2: #99ffbb; --warn: #ffcc33;
    --bad: #ff5555; --ok: #33ff66; --dim: #031a0a;
    --mono: ui-monospace, "JetBrains Mono", Menlo, "DejaVu Sans Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; border-radius: 0 !important; }
  html { background: var(--bg); }
  body {
    margin: 0; font: 14px/1.5 var(--mono); color: var(--text); min-height: 100vh;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    background: var(--bg) repeating-linear-gradient(0deg, var(--dim) 0 1px, transparent 1px 4px) fixed;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { background: var(--text); color: var(--bg); }
  ::selection { background: var(--text); color: var(--bg); }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: .5rem 1rem; border-bottom: 1px solid var(--border);
    background: var(--bg); position: sticky; top: 0; z-index: 10;
  }
  .brand { font-weight: 700; color: var(--accent2); text-transform: uppercase; }
  .brand::before { content: "┌─ "; color: var(--muted); }
  .brand span { color: var(--muted); font-weight: 400; margin-left: .35rem; }
  .brand span::before { content: ":: "; }
  nav a { color: var(--muted); margin-left: .75rem; }
  nav a::before { content: "[ "; } nav a::after { content: " ]"; }
  nav a.active { color: var(--accent2); font-weight: 700; }
  main { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1rem; }
  h1 { font-size: 1rem; margin: 0 0 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
  h1::before { content: "> "; color: var(--muted); }
  h2, h3 { font-size: 1rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
  .grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 1rem; }
  .card { background: var(--panel); border: 1px solid var(--border); padding: .75rem .9rem; }
  .card .label { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; }
  .card .label::before { content: "# "; }
  .card .value { font-size: 1.5rem; font-weight: 700; margin-top: .15rem; color: var(--accent2); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); }
  th, td { text-align: left; padding: .45rem .7rem; border-bottom: 1px dashed var(--border); vertical-align: top; }
  th { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; background: var(--dim); border-bottom: 1px solid var(--border); font-weight: 700; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--dim); }
  .pill { display: inline-block; padding: 0 .3rem; font-size: .8rem; font-weight: 700; border: 1px solid var(--muted); color: var(--muted); text-transform: lowercase; }
  .pill::before { content: "["; } .pill::after { content: "]"; }
  .pill.ok { border-color: var(--ok); color: var(--ok); }
  .pill.bad { border-color: var(--bad); color: var(--bad); }
  .pill.warn { border-color: var(--warn); color: var(--warn); }
  .muted { color: var(--muted); }
  .stack { display: grid; gap: 1rem; }
  button, .btn {
    appearance: none; border: 1px solid var(--text); background: var(--bg); color: var(--text);
    padding: .25rem .6rem; font: inherit; cursor: pointer; text-transform: uppercase; letter-spacing: .04em;
  }
  button::before, .btn::before { content: "[ "; } button::after, .btn::after { content: " ]"; }
  button:hover, .btn:hover { background: var(--text); color: var(--bg); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  footer { margin-top: 2rem; color: var(--muted); font-size: .8rem; border-top: 1px solid var(--border); padding-top: .5rem; }
  footer::before { content: "└─ "; }
  code { font-family: var(--mono); font-size: 1em; color: var(--accent2); }
  .row { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
  pre.log { background: var(--bg); border: 1px solid var(--border); padding: .6rem; margin: .75rem 0 0;
    font: 13px/1.4 var(--mono); color: var(--text); max-height: 22rem; overflow: auto; white-space: pre-wrap; }
  .spin { display:inline-block; width:1ch; margin-left:.35em; }
  .spin::before { content: "|"; display: inline-block; animation: spin .8s steps(4) infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .card.job { margin-bottom: 1rem; }
  .error { background: var(--bg); color: var(--bad); border: 1px solid var(--bad); padding: .5rem .8rem; margin-bottom: 1rem; }
  .error::before { content: "!! "; font-weight: 700; }
  .error.warn { color: var(--warn); border-color: var(--warn); }
  .pill.big { font-size: .9rem; padding: .1rem .45rem; }
  .grid.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .connect .cmd { justify-content: space-between; padding: .3rem 0; border-bottom: 1px dashed var(--border); }
  .connect .cmd:last-child { border-bottom: 0; }
  button.copy { padding: 0 .3rem; font-size: .75rem; }
  button.bad { border-color: var(--bad); color: var(--bad); }
  button.bad:hover { background: var(--bad); color: var(--bg); }
  details.popover { position: relative; }
  details.popover summary { list-style: none; display: inline-block; cursor: pointer; }
  details.popover summary::-webkit-details-marker { display: none; }
  details.popover > form.card { position: absolute; right: 0; top: calc(100% + .4rem); z-index: 20; width: 22rem; display: grid; gap: .6rem; border-color: var(--text); box-shadow: 4px 4px 0 var(--dim); }
  details.danger > form.card { border-color: var(--bad); }
  form.form { display: grid; gap: 1rem; }
  form label { display: grid; gap: .3rem; }
  form label.radio { grid-template-columns: auto 1fr; align-items: baseline; gap: .5rem; }
  form label.radio input { margin: 0; }
  form label.radio strong { margin-right: .4rem; }
  form input[type=text], form input:not([type]), form select, form textarea { background: var(--bg); color: var(--accent2); border: 1px solid var(--border); padding: .35rem .5rem; font: inherit; }
  form input:focus, form select:focus, form textarea:focus { outline: none; border-color: var(--text); box-shadow: 0 0 0 1px var(--text); }
  input, select, textarea { accent-color: var(--text); }
  form fieldset { border: 1px solid var(--border); padding: .6rem .9rem; display: grid; gap: .5rem; }
  form legend { color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; padding: 0 .4rem; }
  .meter { height: 10px; background: var(--bg); border: 1px solid var(--border); overflow: hidden; margin-top: .6rem; }
  .meter span { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--text) 0 6px, transparent 6px 8px); }
  .meter span.warn { background: repeating-linear-gradient(90deg, var(--warn) 0 6px, transparent 6px 8px); }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: .25rem .75rem; margin: .5rem 0 0; }
  .kv dt { color: var(--muted); } .kv dt::after { content: ":"; } .kv dd { margin: 0; }
  ul.plain { list-style: none; padding: 0; margin: .25rem 0 0; } ul.plain li { padding: .15rem 0; }
  ul.plain li::before { content: "- "; color: var(--muted); }
  .inline-form { display: inline-flex; gap: .4rem; align-items: center; }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border: 1px solid var(--bg); }
</style>
{{end}}

<header>
  <div class="brand">KaaS <span>local UI</span></div>
  <nav>
    <a href="/" {{if eq .Active "home"}}class="active"{{end}}>Overview</a>
    <a href="/sandboxes" {{if eq .Active "sandboxes"}}class="active"{{end}}>Sandboxes</a>
    <a href="/templates" {{if eq .Active "templates"}}class="active"{{end}}>Templates</a>
    <a href="/services" {{if eq .Active "services"}}class="active"{{end}}>Services</a>

  </nav>
</header>
{{end}}
